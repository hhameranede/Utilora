name: ExportFlow — Laguna roadmap execution

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/exportflow-laguna.yml"
      - ".github/EXPORTFLOW_LAGUNA_TRIGGER"

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: exportflow-laguna-roadmap
  cancel-in-progress: false

jobs:
  implement:
    name: Run Laguna on ExportFlow
    runs-on: ubuntu-latest
    timeout-minutes: 220
    steps:
      - name: Verify required secrets without printing their values
        shell: bash
        env:
          EXPORTFLOW_GITHUB_TOKEN: ${{ secrets.EXPORTFLOW_GITHUB_TOKEN }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${EXPORTFLOW_GITHUB_TOKEN:-}" ]; then
            echo "::error::EXPORTFLOW_GITHUB_TOKEN is missing from UTILORA Actions secrets."
            exit 1
          fi
          if [ -z "${NVIDIA_API_KEY:-}" ]; then
            echo "::error::NVIDIA_API_KEY is missing from UTILORA Actions secrets."
            exit 1
          fi
          echo "Both required secrets are configured. Values were not printed."

      - name: Check out the UTILORA runner
        uses: actions/checkout@v4
        with:
          ref: main
          path: utilora
          persist-credentials: false

      - name: Validate Laguna runner safety tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Laguna runner unit tests
        working-directory: utilora
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/run_exportflow_laguna.py scripts/test_exportflow_laguna.py scripts/prepare_exportflow_prompt.py scripts/test_prepare_exportflow_prompt.py
          python3 -m unittest discover -s scripts -p 'test_exportflow_laguna.py' -v
          python3 -m unittest discover -s scripts -p 'test_prepare_exportflow_prompt.py' -v

      - name: Check out ExportFlow without persisting credentials
        uses: actions/checkout@v4
        with:
          repository: hhameranede/exportflow
          ref: main
          path: exportflow
          token: ${{ secrets.EXPORTFLOW_GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: exportflow/package-lock.json

      - name: Install the pinned ExportFlow dependencies
        working-directory: exportflow
        run: npm ci --no-audit --no-fund --foreground-scripts

      - name: Fetch authoritative roadmap, comments, and current PR context
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.EXPORTFLOW_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          set +x
          gh auth setup-git --hostname github.com
          gh api repos/hhameranede/exportflow/issues/29 > "$RUNNER_TEMP/exportflow-issue-29.json"
          gh api --paginate --slurp repos/hhameranede/exportflow/issues/29/comments > "$RUNNER_TEMP/exportflow-issue-29-comments.json"
          gh api 'repos/hhameranede/exportflow/pulls?state=open&per_page=50' > "$RUNNER_TEMP/exportflow-open-prs.json"

          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"]) / "exportflow"
          prs = json.loads(Path(os.environ["RUNNER_TEMP"], "exportflow-open-prs.json").read_text())
          safe_env = dict(os.environ)
          # GH_TOKEN is limited to this trusted PR-ref fetch subprocess. It is never
          # passed into the Laguna runner or any verification process.
          for key in ("EXPORTFLOW_GITHUB_TOKEN", "NVIDIA_API_KEY"):
              safe_env.pop(key, None)
          fetched = []
          for item in prs:
              number = item.get("number")
              if not isinstance(number, int):
                  continue
              result = subprocess.run(
                  ["git", "fetch", "--no-tags", "origin",
                   f"refs/pull/{number}/head:refs/remotes/origin/pr-{number}"],
                  cwd=root, env=safe_env, capture_output=True, text=True, timeout=90,
              )
              if result.returncode == 0:
                  fetched.append(number)
              else:
                  print(f"PR #{number}: ref fetch unavailable; metadata remains in prompt.")
          Path(os.environ["RUNNER_TEMP"], "exportflow-fetched-prs.json").write_text(
              json.dumps(fetched), encoding="utf-8"
          )
          print("Fetched readable PR refs: " + ", ".join("#" + str(n) for n in fetched))
          PY

          python3 utilora/scripts/prepare_exportflow_prompt.py \
            --temp-dir "$RUNNER_TEMP" \
            --template utilora/prompts/exportflow-roadmap-prompt.md

      - name: Install temporary Laguna profile and curated skills
        shell: bash
        run: |
          set -euo pipefail
          if [ -e "$GITHUB_WORKSPACE/exportflow/.opencode" ]; then
            echo "::error::ExportFlow already contains .opencode; refusing to overwrite project configuration."
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/exportflow/.opencode/agents"
          cp -a "$GITHUB_WORKSPACE/utilora/.opencode/skills" "$GITHUB_WORKSPACE/exportflow/.opencode/skills"
          cat > "$GITHUB_WORKSPACE/exportflow/.opencode/agents/long-horizon-engineer.md" <<'AGENT'
          ---
          description: Executes the ExportFlow product roadmap with bounded write access and independent verification.
          mode: primary
          model: nvidia-nim/laguna-xs-2-1
          permission:
            read: allow
            glob: allow
            grep: allow
            list: allow
            edit: allow
            skill:
              "*": allow
            bash:
              "*": deny
              "git status*": allow
              "git diff*": allow
              "git log*": allow
              "git show*": allow
              "git grep*": allow
              "git branch*": allow
            external_directory: deny
          ---
          You are Laguna XS 2.1, the sole long-horizon implementation engineer for ExportFlow.
          Work only in the repository workspace. You may read and edit project source, tests,
          localization, SEO and documentation. You may use installed project skills.
          Shell access is denied except read-only Git inspection. Do not commit, push, merge,
          deploy, access Cloudflare, touch DNS or remote databases, inspect secrets, or change
          account/repository settings. The trusted runner executes tests without credentials
          and returns exact failures for same-session repair. Never weaken tests or fabricate results.
          AGENT
          echo "Temporary Laguna profile installed; repository write token is not available to the agent."
          touch "$RUNNER_TEMP/exportflow-laguna-profile-created"

      - name: Install OpenCode
        run: |
          set -euo pipefail
          npm install --global opencode-ai@1.19.5
          opencode --version

      - name: Execute Laguna with bounded self-repair
        timeout-minutes: 205
        working-directory: utilora
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          EXPORTFLOW_WORKSPACE: ${{ github.workspace }}/exportflow
        run: |
          set -euo pipefail
          set +x
          python3 scripts/run_exportflow_laguna.py \
            --prompt-file "$RUNNER_TEMP/exportflow-laguna-prompt.md" \
            --output-file "$RUNNER_TEMP/exportflow-laguna-report.md" \
            --initial-seconds 7800 \
            --recovery-seconds 300 \
            --repair-seconds 900 \
            --max-repair-rounds 2

      - name: Remove temporary agent profile from the checkout
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/exportflow-laguna-profile-created" ]; then
            rm -rf "$GITHUB_WORKSPACE/exportflow/.opencode"
          fi

      - name: Create the review patch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git -C "$GITHUB_WORKSPACE/exportflow" add --intent-to-add --all
          git -C "$GITHUB_WORKSPACE/exportflow" diff --binary --full-index HEAD > "$RUNNER_TEMP/exportflow.patch"
          test -s "$RUNNER_TEMP/exportflow.patch"
          echo "Patch created for the separate publish job."

      - name: Upload patch and Laguna report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: exportflow-laguna-patch-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/exportflow.patch
            ${{ runner.temp }}/exportflow-laguna-report.md
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish one review PR
    needs: implement
    if: needs.implement.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out ExportFlow with the write token in the trusted publish job only
        uses: actions/checkout@v4
        with:
          repository: hhameranede/exportflow
          ref: main
          path: exportflow
          token: ${{ secrets.EXPORTFLOW_GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Download the verified Laguna patch
        uses: actions/download-artifact@v4
        with:
          name: exportflow-laguna-patch-${{ github.run_id }}
          path: ${{ runner.temp }}/exportflow-laguna-artifact

      - name: Create a branch and open the review PR
        working-directory: exportflow
        env:
          GH_TOKEN: ${{ secrets.EXPORTFLOW_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          set +x
          PATCH="$RUNNER_TEMP/exportflow-laguna-artifact/exportflow.patch"
          REPORT="$RUNNER_TEMP/exportflow-laguna-artifact/exportflow-laguna-report.md"
          test -s "$PATCH"
          test -s "$REPORT"

          BRANCH="laguna/roadmap-issue-29-${GITHUB_RUN_ID}"
          git switch -c "$BRANCH"
          git apply --binary "$PATCH"
          git diff --check
          if git diff --quiet; then
            echo "::error::The verified patch contains no changes."
            exit 1
          fi

          git add --all
          git -c user.name="Laguna XS 2.1" -c user.email="laguna-bot@users.noreply.github.com" \
            commit -m "feat: advance ExportFlow roadmap with Laguna"
          git push --set-upstream origin "$BRANCH"

          cat > "$RUNNER_TEMP/exportflow-pr-body.md" <<'HEADER'
          ## Laguna roadmap implementation

          This PR is the single reviewable implementation output for ExportFlow Issue #29.

          - Implemented by the Laguna long-horizon runner against the ExportFlow main checkout.
          - The trusted runner executed syntax checks, npm test, npm run lint, npm run build,
            locale/hreflang verification, and the local Pages Functions bundle.
          - PR #30 and available open PR work were supplied for review before implementation.
          - No merge, production deployment, DNS change, remote D1 operation, or Cloudflare account change was performed.

          Agent implementation and verification record:

          ---
          HEADER
          cat "$REPORT" >> "$RUNNER_TEMP/exportflow-pr-body.md"

          PR_URL="$(gh pr create \
            --repo hhameranede/exportflow \
            --base main \
            --head "$BRANCH" \
            --title "feat: advance ExportFlow roadmap (Laguna)" \
            --body-file "$RUNNER_TEMP/exportflow-pr-body.md")"
          echo "Opened review PR: $PR_URL" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "The PR remains open and unmerged."
