name: UTILORA Agent Studio — Private Team Run

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Private Agent Studio run identifier
        required: true
        type: string
      mode:
        description: Group council or one-to-one private room
        required: true
        type: choice
        options:
          - group
          - private
      target_agent:
        description: Specialist selected by the private room
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: utilora-agent-studio-${{ inputs.run_id }}
  cancel-in-progress: false

env:
  AGENT_CHAT_API_URL: https://hfokwvgrqbzzunkhflhq.supabase.co/functions/v1/agent-studio-callback
  AGENT_CHAT_MODE: ${{ inputs.mode }}
  AGENT_CHAT_TARGET_AGENT: ${{ inputs.target_agent }}

jobs:
  specialists:
    name: ${{ matrix.agent }}
    if: ${{ inputs.mode == 'group' || matrix.agent == inputs.target_agent }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - agent: problem-analyst
            model: nvidia/deepseek-ai/deepseek-v4.1-flash
          - agent: implementation-engineer
            model: nvidia/minimaxai/minimax-m3.1-flash
          - agent: fast-task-engineer
            model: nvidia/z-ai/glm-5.3-flash
          - agent: visual-reviewer
            model: nvidia/nvidia/nemotron-3.5-super-vl-120b-a12b
          - agent: long-horizon-engineer
            model: nvidia/poolside/laguna-xs-2.1
          - agent: qa-engineer
            model: nvidia/deepseek-ai/deepseek-v4.1-flash
          - agent: security-auditor
            model: nvidia/nvidia/nemotron-3-ultra-550b-a55b
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      AGENT_CHAT_RUN_ID: ${{ inputs.run_id }}
      AGENT_NAME: ${{ matrix.agent }}
      MODEL_ALIAS: ${{ matrix.model }}
    steps:
      - name: Check out UTILORA
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install OpenCode
        run: |
          set -euo pipefail
          npm install --global opencode-ai@1.19.5
          opencode --version

      - name: Run specialist in read-only mode
        run: node apps/agent-studio/scripts/agent-chat-worker.mjs

  project-lead:
    name: Project Lead
    if: always() && (inputs.mode == 'group' || inputs.target_agent == 'project-lead')
    needs: specialists
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      AGENT_CHAT_RUN_ID: ${{ inputs.run_id }}
      AGENT_NAME: project-lead
      MODEL_ALIAS: nvidia/nvidia/nemotron-3-ultra-550b-a55b
    steps:
      - name: Check out UTILORA
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install OpenCode
        run: |
          set -euo pipefail
          npm install --global opencode-ai@1.19.5
          opencode --version

      - name: Respond as Project Lead
        run: node apps/agent-studio/scripts/agent-chat-worker.mjs
