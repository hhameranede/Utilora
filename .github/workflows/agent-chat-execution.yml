name: UTILORA Agent Studio — Private Team Run

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Private Agent Studio run identifier
        required: true
        type: string
      mode:
        description: Group council or one-to-one private room
        required: true
        type: choice
        options:
          - group
          - private
      target_agent:
        description: Specialist selected by the private room
        required: true
        type: string
      target_agents:
        description: Comma-separated specialist IDs selected for this group request
        required: false
        default: "problem-analyst,fast-task-engineer"
        type: string
      dispatch_probe:
        description: Run a permission check without starting any AI agent
        required: false
        default: "false"
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: utilora-agent-studio-${{ inputs.run_id }}
  cancel-in-progress: false

env:
  AGENT_CHAT_API_URL: https://paleenigjkmjwinkblfv.supabase.co/functions/v1/agent-studio-callback
  AGENT_CHAT_MODE: ${{ inputs.mode }}
  AGENT_CHAT_TARGET_AGENT: ${{ inputs.target_agent }}

jobs:
  specialists:
    if: ${{ inputs.dispatch_probe != 'true' && ((inputs.mode == 'private' && matrix.agent == inputs.target_agent) || (inputs.mode == 'group' && contains(format(',{0},', inputs.target_agents), format(',{0},', matrix.agent)))) }}
    name: ${{ matrix.agent }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - agent: problem-analyst
            model: nvidia-nim/deepseek-v4-1-flash
          - agent: implementation-engineer
            model: nvidia-nim/minimax-m3-1-flash
          - agent: fast-task-engineer
            model: nvidia-nim/glm-5-3-flash
          - agent: visual-reviewer
            model: nvidia-nim/nemotron-super-vl
          - agent: long-horizon-engineer
            model: nvidia-nim/laguna-xs-2-1
          - agent: qa-engineer
            model: nvidia-nim/deepseek-v4-1-flash
          - agent: security-auditor
            model: nvidia-nim/nemotron-ultra
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      AGENT_CHAT_RUN_ID: ${{ inputs.run_id }}
      AGENT_NAME: ${{ matrix.agent }}
      MODEL_ALIAS: ${{ matrix.model }}
    steps:
      - name: Check out UTILORA
        if: ${{ inputs.mode == 'group' || matrix.agent == inputs.target_agent }}
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        if: ${{ inputs.mode == 'group' || matrix.agent == inputs.target_agent }}
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install OpenCode
        if: ${{ inputs.mode == 'group' || matrix.agent == inputs.target_agent }}
        run: |
          set -euo pipefail
          npm install --global opencode-ai@1.19.5
          opencode --version

      - name: Run specialist in read-only mode
        if: ${{ inputs.mode == 'group' || matrix.agent == inputs.target_agent }}
        run: node apps/agent-studio/scripts/agent-chat-worker.mjs

  project-lead:
    name: Project Lead
    if: ${{ always() && inputs.dispatch_probe != 'true' && (inputs.mode == 'group' || inputs.target_agent == 'project-lead') }}
    needs: specialists
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      AGENT_CHAT_RUN_ID: ${{ inputs.run_id }}
      AGENT_NAME: project-lead
      MODEL_ALIAS: nvidia-nim/nemotron-ultra
    steps:
      - name: Check out UTILORA
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install OpenCode
        run: |
          set -euo pipefail
          npm install --global opencode-ai@1.19.5
          opencode --version

      - name: Respond as Project Lead
        run: node apps/agent-studio/scripts/agent-chat-worker.mjs

  dispatch-probe:
    name: Verify workflow dispatch permission
    if: ${{ inputs.dispatch_probe == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Confirm permission without invoking an AI model
        run: echo "GitHub accepted workflow_dispatch. No agent job or NVIDIA model was started."
