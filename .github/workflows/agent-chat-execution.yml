name: UTILORA Agent Studio — Team Run

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Private Agent Studio run identifier
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: utilora-agent-studio-${{ inputs.run_id }}
  cancel-in-progress: false

jobs:
  specialists:
    name: ${{ matrix.agent }}
    runs-on: ubuntu-latest
    timeout-minutes: 13
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - agent: problem-analyst
            model: nvidia-nim/deepseek-v4-1-flash
          - agent: implementation-engineer
            model: nvidia-nim/minimax-m3-1-flash
          - agent: fast-task-engineer
            model: nvidia-nim/glm-5-3-flash
          - agent: visual-reviewer
            model: nvidia-nim/nemotron-super-vl
          - agent: long-horizon-engineer
            model: nvidia-nim/laguna-xs-2-1
          - agent: qa-engineer
            model: nvidia-nim/deepseek-v4-1-flash
          - agent: security-auditor
            model: nvidia-nim/nemotron-ultra
    steps:
      - name: Check out UTILORA source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Extract Agent Studio source bundle
        run: tar -xzf apps/agent-studio/agent-studio-source.tar.gz -C apps/agent-studio
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install OpenCode
        run: |
          set -euo pipefail
          npm install --global opencode-ai@1.19.5
          opencode --version
      - name: Run specialist and stream progress
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          AGENT_CHAT_API_URL: ${{ secrets.AGENT_CHAT_API_URL }}
          AGENT_CHAT_CALLBACK_SECRET: ${{ secrets.AGENT_CHAT_CALLBACK_SECRET }}
          AGENT_CHAT_RUN_ID: ${{ inputs.run_id }}
          AGENT_NAME: ${{ matrix.agent }}
          MODEL_ALIAS: ${{ matrix.model }}
        run: node apps/agent-studio/scripts/agent-chat-worker.mjs

  project-lead:
    if: always()
    needs: specialists
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - name: Check out UTILORA source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Extract Agent Studio source bundle
        run: tar -xzf apps/agent-studio/agent-studio-source.tar.gz -C apps/agent-studio
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install OpenCode
        run: |
          set -euo pipefail
          npm install --global opencode-ai@1.19.5
          opencode --version
      - name: Synthesize the team response
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          AGENT_CHAT_API_URL: ${{ secrets.AGENT_CHAT_API_URL }}
          AGENT_CHAT_CALLBACK_SECRET: ${{ secrets.AGENT_CHAT_CALLBACK_SECRET }}
          AGENT_CHAT_RUN_ID: ${{ inputs.run_id }}
          AGENT_NAME: project-lead
          MODEL_ALIAS: nvidia-nim/nemotron-ultra
        run: node apps/agent-studio/scripts/agent-chat-worker.mjs
