name: UTILORA recovery · Visual Reviewer

on:
  workflow_dispatch:
    inputs:
      utilora_ref:
        description: Optional immutable UTILORA commit to test; defaults to this workflow revision.
        required: false
        type: string
        default: ""

concurrency:
  group: utilora-recovery-visual-reviewer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  recovery:
    uses: ./.github/workflows/_agent-recovery-reusable.yml
    with:
      utilora_ref: ${{ inputs.utilora_ref || github.sha }}
      agent_name: "visual-reviewer"
      model_alias: "nemotron-super-vl"
      model_id: "nvidia/nemotron-3.5-super-vl-120b-a12b"
      skill_name: "accessibility-ux"
      diagnosis_focus: >-
        The model catalogue, live inference, agent resolution, and real screenshot capture succeeded. The previous run completed two repository/evidence calls but recorded zero calls to the native skill tool. Explicitly load accessibility-ux via the native skill tool before examining the screenshot, then return OUTCOME, EVIDENCE, and LIMITATIONS with screenshot-specific evidence.
    secrets: inherit
