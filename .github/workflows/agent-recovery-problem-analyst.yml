name: UTILORA recovery · Problem Analyst

on:
  workflow_dispatch:
    inputs:
      utilora_ref:
        description: Optional immutable UTILORA commit to test; defaults to this workflow revision.
        required: false
        type: string
        default: ""

concurrency:
  group: utilora-recovery-problem-analyst-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  recovery:
    uses: ./.github/workflows/_agent-recovery-reusable.yml
    with:
      utilora_ref: ${{ inputs.utilora_ref || github.sha }}
      agent_name: "problem-analyst"
      model_alias: "deepseek-v4-1-flash"
      model_id: "deepseek-ai/deepseek-v4.1-flash"
      skill_name: "research"
      diagnosis_focus: >-
        The previous full smoke run recorded a native research skill call and three completed evidence calls, but returned only a short 130-character response without the required role/evidence structure. Produce the three required report sections: OUTCOME, EVIDENCE, and LIMITATIONS, compare a bounded diagnosis with an alternative, and cite concrete repository paths inspected.
    secrets: inherit
