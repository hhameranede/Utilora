name: UTILORA isolated agent recovery

on:
  workflow_call:
    inputs:
      utilora_ref:
        description: Optional immutable UTILORA commit to test; defaults to the caller revision.
        required: false
        type: string
        default: ""
      agent_name:
        required: true
        type: string
      model_alias:
        required: true
        type: string
      model_id:
        required: true
        type: string
      skill_name:
        required: true
        type: string
      diagnosis_focus:
        required: true
        type: string
    secrets:
      NVIDIA_API_KEY:
        required: true

permissions:
  contents: read

jobs:
  recover:
    name: "${{ inputs.agent_name }} isolated recovery"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pinned UTILORA revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.utilora_ref || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify agent, skill, and project configuration
        env:
          AGENT_NAME: ${{ inputs.agent_name }}
          SKILL_NAME: ${{ inputs.skill_name }}
          MODEL_ALIAS: ${{ inputs.model_alias }}
        run: |
          set -euo pipefail
          test -f opencode.json
          test -f ".opencode/agents/$AGENT_NAME.md"
          test -f ".opencode/skills/$SKILL_NAME/SKILL.md"
          test -f ".opencode/skills/manifest.json"
          echo "Validated repository configuration for $AGENT_NAME and $SKILL_NAME."

      - name: Verify NVIDIA credential and assigned model
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          EXPECTED_MODEL: ${{ inputs.model_id }}
        run: |
          set -euo pipefail
          set +x
          if [ -z "$NVIDIA_API_KEY" ]; then
            echo "::error::UTILORA repository secret NVIDIA_API_KEY is missing."
            exit 1
          fi
          curl --connect-timeout 10 --max-time 30 --fail --silent --show-error \
            https://integrate.api.nvidia.com/v1/models \
            -H "Authorization: Bearer $NVIDIA_API_KEY" \
            -o "$RUNNER_TEMP/nvidia-models.json"
          python3 - <<'PY'
          import json, os, pathlib, sys
          data = json.loads(pathlib.Path(os.environ["RUNNER_TEMP"], "nvidia-models.json").read_text())
          ids = {item.get("id") for item in data.get("data", []) if isinstance(item, dict)}
          expected = os.environ["EXPECTED_MODEL"]
          if expected not in ids:
              print("::error::Assigned model is not listed for the configured credential: " + expected)
              sys.exit(1)
          print("NVIDIA catalogue check passed for " + expected)
          PY

      - name: Verify a real inference response
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          MODEL_ID: ${{ inputs.model_id }}
        run: |
          set -euo pipefail
          set +x
          python3 - <<'PY'
          import json, os, pathlib
          payload = {
              "model": os.environ["MODEL_ID"],
              "messages": [{"role": "user", "content": "Reply exactly: UTILORA_RECOVERY_OK"}],
              "max_tokens": 128,
              "temperature": 0.1,
              "stream": False
          }
          pathlib.Path(os.environ["RUNNER_TEMP"], "request.json").write_text(json.dumps(payload))
          PY
          set +e
          status=$(curl --connect-timeout 10 --max-time 300 --silent --show-error \
            -o "$RUNNER_TEMP/response.json" -w "%{http_code}" \
            https://integrate.api.nvidia.com/v1/chat/completions \
            -H "Authorization: Bearer $NVIDIA_API_KEY" \
            -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/request.json")
          curl_exit=$?
          set -e
          export HTTP_STATUS="$status" CURL_EXIT="$curl_exit"
          python3 - <<'PY'
          import json, os, pathlib, sys
          path = pathlib.Path(os.environ["RUNNER_TEMP"], "response.json")
          try:
              data = json.loads(path.read_text())
          except Exception:
              data = {}
          choices = data.get("choices", [])
          message = choices[0].get("message", {}) if choices and isinstance(choices[0], dict) else {}
          content = message.get("content", "")
          if isinstance(content, list):
              content = "".join(x.get("text", "") for x in content if isinstance(x, dict))
          if os.environ["CURL_EXIT"] != "0" or os.environ["HTTP_STATUS"] != "200":
              print("::error::NVIDIA inference failed; HTTP " + os.environ["HTTP_STATUS"] + "; curl exit " + os.environ["CURL_EXIT"])
              sys.exit(1)
          if not isinstance(content, str) or "UTILORA_RECOVERY_OK" not in content:
              print("::error::NVIDIA returned no valid recovery sentinel for " + os.environ["MODEL_ID"])
              sys.exit(1)
          print("Real inference passed for " + os.environ["MODEL_ID"])
          path.unlink(missing_ok=True)
          pathlib.Path(os.environ["RUNNER_TEMP"], "request.json").unlink(missing_ok=True)
          PY

      - name: Install OpenCode CLI
        run: npm install --global opencode-ai@1

      - name: Resolve agent and model route
        env:
          AGENT_NAME: ${{ inputs.agent_name }}
          MODEL_ALIAS: ${{ inputs.model_alias }}
          TARGET_DIR: ${{ github.workspace }}
        run: |
          set -euo pipefail
          opencode debug config > "$RUNNER_TEMP/opencode-config.json"
          opencode agent list > "$RUNNER_TEMP/opencode-agents.txt"
          grep -Fq "$AGENT_NAME" "$RUNNER_TEMP/opencode-agents.txt"
          opencode debug agent "$AGENT_NAME" > "$RUNNER_TEMP/resolved-agent.json"
          python3 - <<'PY'
          import json, os, pathlib, re, sys
          name = os.environ["AGENT_NAME"]
          data = json.loads(pathlib.Path(os.environ["RUNNER_TEMP"], "resolved-agent.json").read_text())
          if data.get("name") != name:
              print("::error::OpenCode resolved the wrong agent.")
              sys.exit(1)
          text = pathlib.Path(".opencode/agents", name + ".md").read_text()
          frontmatter = text.split("---", 2)[1]
          model = re.search(r"^model:\s*(\S+)\s*$", frontmatter, re.M)
          expected = "nvidia-nim/" + os.environ["MODEL_ALIAS"]
          if not model or model.group(1) != expected:
              print("::error::Agent model route does not match the isolated recovery workflow.")
              sys.exit(1)
          print("Resolved " + name + " to " + expected)
          PY

      - name: Prepare real visual evidence
        if: inputs.agent_name == 'visual-reviewer'
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx playwright install chromium
          npm run dev -- --host 127.0.0.1 --port 3000 > "$RUNNER_TEMP/utilora-vite.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/utilora-vite.pid"
          ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::Local preview did not become ready."
            tail -n 30 "$RUNNER_TEMP/utilora-vite.log"
            exit 1
          fi
          npx playwright screenshot --browser chromium --viewport-size "1365,900" \
            http://127.0.0.1:3000/ "$RUNNER_TEMP/utilora-homepage.png"
          test -s "$RUNNER_TEMP/utilora-homepage.png"

      - name: Run isolated recovery assessment
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          AGENT_NAME: ${{ inputs.agent_name }}
          SKILL_NAME: ${{ inputs.skill_name }}
          MODEL_ROUTE: nvidia-nim/${{ inputs.model_alias }}
          MODEL_ID: ${{ inputs.model_id }}
          RECOVERY_FOCUS: ${{ inputs.diagnosis_focus }}
          RAW_REPORT: ${{ runner.temp }}/agent-output.jsonl
          SAFE_REPORT_DIR: ${{ github.workspace }}/agent-reports
          SCREENSHOT: ${{ runner.temp }}/utilora-homepage.png
        run: |
          set -euo pipefail
          set +x
          mkdir -p "$SAFE_REPORT_DIR"
          PROMPT="$(cat <<EOF
          This is a dedicated recovery run for UTILORA agent $AGENT_NAME.
          The sole purpose is to resolve this previously observed failure:
          $RECOVERY_FOCUS

          FIRST: invoke the native skill tool and load exactly "$SKILL_NAME".
          Do not merely read the skill file and claim that the tool was used.
          SECOND: inspect README.md, your own .opencode/agents/$AGENT_NAME.md,
          and the assigned skill's repository content using read-only tools.
          For visual-reviewer, inspect the attached real homepage screenshot.
          For implementation-engineer, describe a minimal implementation plan and a precise regression test;
          do not modify files in this recovery run.
          Do not edit, create, delete, commit, push, merge, deploy, inspect environment variables,
          read .env files, or call external services.
          Return a complete evidence-based report with exactly these labeled sections,
          each on its own line and with useful detail:
          ROLE:
          MODEL:
          SKILL_LOADED:
          EVIDENCE:
          FINDING:
          LIMITATION:
          Do not claim a tool call, screenshot inspection, or finding that you did not actually perform.
          EOF
          )"
          cd "$GITHUB_WORKSPACE"
          set +e
          if [ "$AGENT_NAME" = "visual-reviewer" ]; then
            opencode run --dir "$GITHUB_WORKSPACE" --agent "$AGENT_NAME" --model "$MODEL_ROUTE" \
              --file "$SCREENSHOT" --format json "$PROMPT" > "$RAW_REPORT" 2> "$RUNNER_TEMP/opencode-stderr.txt"
          else
            opencode run --dir "$GITHUB_WORKSPACE" --agent "$AGENT_NAME" --model "$MODEL_ROUTE" \
              --format json "$PROMPT" > "$RAW_REPORT" 2> "$RUNNER_TEMP/opencode-stderr.txt"
          fi
          opencode_status=$?
          set -e
          if [ "$opencode_status" -ne 0 ]; then
            echo "::error::OpenCode failed for $AGENT_NAME (exit $opencode_status)."
            python3 - <<'PY'
          import os, pathlib, re
          path = pathlib.Path(os.environ["RUNNER_TEMP"], "opencode-stderr.txt")
          if path.exists():
              secret = os.environ.get("NVIDIA_API_KEY", "")
              for line in path.read_text(errors="replace").splitlines()[-30:]:
                  if re.search(r"(?i)(authorization|bearer|nvidia_api_key|nvapi-)", line):
                      continue
                  if secret:
                      line = line.replace(secret, "[REDACTED]")
                  print(re.sub(r"(?i)nvapi-[A-Za-z0-9_-]{8,}", "[REDACTED]", line)[:400])
          PY
            exit "$opencode_status"
          fi
          python3 - <<'PY'
          import json, os, pathlib, re, sys
          raw_path = pathlib.Path(os.environ["RAW_REPORT"])
          raw = raw_path.read_text(encoding="utf-8", errors="replace")
          secret = os.environ.get("NVIDIA_API_KEY", "")
          report_dir = pathlib.Path(os.environ["SAFE_REPORT_DIR"])
          report_dir.mkdir(parents=True, exist_ok=True)

          def fail(reason, events, skill_calls, read_calls, text_length, missing):
              diagnostic = (
                  "# Recovery diagnostic: " + os.environ["AGENT_NAME"] + "\n\n"
                  "- Model: " + os.environ["MODEL_ID"] + "\n"
                  "- Assigned skill: " + os.environ["SKILL_NAME"] + "\n"
                  "- Parsed events: " + str(len(events)) + "\n"
                  "- Assigned skill tool calls: " + str(skill_calls) + "\n"
                  "- Completed evidence calls: " + str(read_calls) + "\n"
                  "- Assistant text characters: " + str(text_length) + "\n"
                  "- Missing report labels: " + (", ".join(missing) or "none") + "\n"
                  "- Failure: " + reason + "\n"
              )
              (report_dir / (os.environ["AGENT_NAME"] + ".recovery-diagnostic.md")).write_text(diagnostic)
              print("::error::" + reason)
              raw_path.unlink(missing_ok=True)
              sys.exit(1)

          if (secret and secret in raw) or re.search(r"(?i)nvapi-[A-Za-z0-9_-]{12,}", raw):
              fail("Credential-like material was detected; raw output was suppressed.", [], 0, 0, 0, [])
          events = []
          for line in raw.splitlines():
              try:
                  event = json.loads(line)
                  if isinstance(event, dict) and isinstance(event.get("type"), str):
                      events.append(event)
              except json.JSONDecodeError:
                  continue

          skill_calls = 0
          read_calls = 0
          text_parts = []
          for event in events:
              part = event.get("part") or {}
              state = part.get("state") or {}
              tool = part.get("tool")
              details = json.dumps(event, ensure_ascii=False)
              if event.get("type") == "tool_use":
                  if tool == "skill" and os.environ["SKILL_NAME"] in details:
                      skill_calls += 1
                  if tool in {"read", "grep", "glob", "list", "bash"} and state.get("status") == "completed":
                      read_calls += 1
              if event.get("type") == "text":
                  value = part.get("text")
                  if isinstance(value, str):
                      text_parts.append(value)

          final_text = "\n".join(text_parts).strip()
          labels = ["ROLE", "MODEL", "SKILL_LOADED", "EVIDENCE", "FINDING", "LIMITATION"]
          missing = [
              label for label in labels
              if not re.search(r"(?im)^\s*(?:#{1,6}\s*)?" + re.escape(label) + r"\s*:", final_text)
          ]
          if skill_calls < 1:
              fail("The agent still did not invoke its assigned native skill tool.", events, skill_calls, read_calls, len(final_text), missing)
          if read_calls < 2:
              fail("The agent did not complete at least two evidence-inspection tool calls.", events, skill_calls, read_calls, len(final_text), missing)
          if len(final_text) < 180 or missing:
              fail("The recovery report is incomplete or missing required labeled sections.", events, skill_calls, read_calls, len(final_text), missing)
          if re.search(r"(?i)nvapi-[A-Za-z0-9_-]{12,}", final_text):
              fail("The final report resembled a credential; report suppressed.", events, skill_calls, read_calls, len(final_text), [])
          report = (
              "# Isolated recovery PASS: " + os.environ["AGENT_NAME"] + "\n\n"
              "- Model: " + os.environ["MODEL_ID"] + "\n"
              "- Skill loaded via native tool: " + os.environ["SKILL_NAME"] + "\n"
              "- Completed evidence calls: " + str(read_calls) + "\n"
              "- Parsed OpenCode events: " + str(len(events)) + "\n\n"
              + final_text + "\n"
          )
          (report_dir / (os.environ["AGENT_NAME"] + ".recovery.md")).write_text(report)
          raw_path.unlink(missing_ok=True)
          print("PASS: isolated recovery evidence is complete for " + os.environ["AGENT_NAME"])
          PY
          git diff --exit-code
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The read-only recovery agent modified the repository checkout."
            exit 1
          fi
          echo "Isolated recovery checks passed for $AGENT_NAME." >> "$GITHUB_STEP_SUMMARY"

      - name: Stop local preview
        if: always() && inputs.agent_name == 'visual-reviewer'
        run: |
          if [ -f "$RUNNER_TEMP/utilora-vite.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/utilora-vite.pid")" 2>/dev/null || true
          fi

      - name: Upload sanitized recovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: utilora-agent-recovery-${{ inputs.agent_name }}
          path: agent-reports/
          if-no-files-found: ignore
          retention-days: 7
