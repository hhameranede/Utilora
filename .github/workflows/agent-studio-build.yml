name: Agent Studio build checks

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/agent-studio/**"
      - ".github/workflows/agent-studio-build.yml"
  push:
    branches: [main]
    paths:
      - "apps/agent-studio/**"
      - ".github/workflows/agent-studio-build.yml"

permissions:
  contents: read

jobs:
  build-agent-studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Agent Studio dependencies
        run: npm install --no-audit --no-fund
      - name: Test bounty analysis refresh
        run: npm run test:bounty-hunter
      - name: Test safe OpenCode session recovery
        run: npm run test:agent-runtime
      - name: Check JavaScript syntax
        run: |
          node --check src/main.js
          node --check src/bounty-hunter.js
          node --check functions/api/bounties.js
          node --check scripts/agent-chat-worker.mjs
          node --check scripts/opencode-session.mjs
      - name: Build Agent Studio
        run: npm run build
