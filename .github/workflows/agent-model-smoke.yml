name: UTILORA agent capability check

on:
  push:
    branches:
      - feat/autonomous-agent-foundation-2026-11-01
  workflow_dispatch:
    inputs:
      utilora_ref:
        description: Optional UTILORA branch, tag, or commit to inspect
        required: false
        type: string
        default: ""

concurrency:
  group: utilora-agent-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  credential-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require NVIDIA NIM credential
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -euo pipefail
          set +x
          if [ -z "$NVIDIA_API_KEY" ]; then
            echo "::error::Missing repository Actions secret NVIDIA_API_KEY."
            exit 1
          fi
          echo "NVIDIA NIM credential is configured; its value is not displayed."

  agent-check:
    needs: credential-preflight
    name: "${{ matrix.agent }} · ${{ matrix.model_id }}"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - agent: project-lead
            model_alias: nemotron-ultra
            model_id: nvidia/nemotron-3-ultra-550b-a55b
          - agent: problem-analyst
            model_alias: deepseek-v4-1-flash
            model_id: deepseek-ai/deepseek-v4.1-flash
          - agent: implementation-engineer
            model_alias: minimax-m3-1-flash
            model_id: minimaxai/minimax-m3.1-flash
          - agent: fast-task-engineer
            model_alias: glm-5-3-flash
            model_id: z-ai/glm-5.3-flash
          - agent: visual-reviewer
            model_alias: nemotron-super-vl
            model_id: nvidia/nemotron-3.5-super-vl-120b-a12b
          - agent: long-horizon-engineer
            model_alias: laguna-xs-2-1
            model_id: poolside/laguna-xs-2.1
          - agent: qa-engineer
            model_alias: deepseek-v4-1-flash
            model_id: deepseek-ai/deepseek-v4.1-flash
          - agent: security-auditor
            model_alias: nemotron-ultra
            model_id: nvidia/nemotron-3-ultra-550b-a55b

    steps:
      - name: Checkout UTILORA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.utilora_ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install OpenCode
        run: npm install --global opencode-ai@1.19.5

      - name: Record OpenCode CLI version
        run: opencode --version

      - name: Prepare a real visual sample
        if: matrix.agent == 'visual-reviewer'
        run: |
          set -euo pipefail
          npm install --no-package-lock --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run dev -- --host 127.0.0.1 --port 3000 > "$RUNNER_TEMP/utilora-vite.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/utilora-vite.pid"
          ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::Local preview did not become ready."
            tail -n 30 "$RUNNER_TEMP/utilora-vite.log"
            exit 1
          fi
          npx playwright screenshot --browser chromium --viewport-size "1365,900" http://127.0.0.1:3000/ "$RUNNER_TEMP/utilora-homepage.png"
          test -s "$RUNNER_TEMP/utilora-homepage.png"

      - name: Apply an isolated no-tool OpenCode smoke overlay
        env:
          AGENT_NAME: ${{ matrix.agent }}
        run: |
          set -euo pipefail
          OPENCODE_CONFIG_CONTENT="$(python3 - <<'PY'
          import json, os
          agent = os.environ["AGENT_NAME"]
          denied = [
              "read", "edit", "glob", "grep", "list", "bash", "task",
              "todowrite", "skill", "question", "lsp", "webfetch",
              "websearch", "external_directory"
          ]
          overlay = {
              "agent": {agent: {"permission": {name: "deny" for name in denied}}},
              "mcp": {
                  name: {"enabled": False}
                  for name in [
                      "playwright", "context7", "firecrawl",
                      "cloudflare-docs", "cloudflare-api", "posthog"
                  ]
              }
          }
          print(json.dumps(overlay, separators=(",", ":")))
          PY
          )"
          echo "OPENCODE_CONFIG_CONTENT=$OPENCODE_CONFIG_CONTENT" >> "$GITHUB_ENV"
          export OPENCODE_CONFIG_CONTENT
          opencode debug agent "$AGENT_NAME" > "$RUNNER_TEMP/agent-smoke-config.json"
          python3 - <<'PY'
          import json, os, pathlib, sys
          resolved = json.loads(pathlib.Path(os.environ["RUNNER_TEMP"], "agent-smoke-config.json").read_text())
          rules = resolved.get("permission")
          if not isinstance(rules, list):
              print("::error::OpenCode did not expose effective smoke permissions.")
              sys.exit(1)
          required = {
              "read", "edit", "glob", "grep", "list", "bash", "task",
              "todowrite", "skill", "question", "lsp", "webfetch",
              "websearch", "external_directory"
          }
          denied = {
              rule.get("permission")
              for rule in rules
              if isinstance(rule, dict) and rule.get("action") == "deny"
          }
          missing = sorted(required - denied)
          if missing:
              print("::error::Smoke-only deny overlay was not effective for: " + ",".join(missing))
              sys.exit(1)
          print("OpenCode diagnostic overlay verified: tools, skills and MCP access are denied only for this smoke invocation.")
          PY

      - name: Ask the agent for its role perspective
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          AGENT_NAME: ${{ matrix.agent }}
          MODEL_ROUTE: nvidia-nim/${{ matrix.model_alias }}
          MODEL_ID: ${{ matrix.model_id }}
          SCREENSHOT: ${{ runner.temp }}/utilora-homepage.png
        run: |
          set -euo pipefail
          set +x
          export PYTHONDONTWRITEBYTECODE=1
          PROMPT="$(cat <<'EOF'
          This is a non-interactive OpenCode routing check for your configured UTILORA role.
          Reply directly in one or two short sentences. State your configured agent role and describe its specialist responsibility.
          Do not call tools, delegate to subagents, invoke skills, browse, inspect files, or claim to have performed work.
          For visual-reviewer, also mention one directly visible observation from the attached screenshot. Do not infer details that are not visible.
          Skills are optional in real work; this diagnostic intentionally tests text/image response routing only.
          EOF
          )"
          set +e
          if [ "$AGENT_NAME" = "visual-reviewer" ]; then
            timeout --signal=TERM --kill-after=15s 7m opencode --log-level DEBUG run --dir "$GITHUB_WORKSPACE" --agent "$AGENT_NAME" --model "$MODEL_ROUTE" --file "$SCREENSHOT" --format json "$PROMPT" > "$RUNNER_TEMP/agent-output.jsonl" 2> "$RUNNER_TEMP/opencode-stderr.txt"
          else
            timeout --signal=TERM --kill-after=15s 7m opencode --log-level DEBUG run --dir "$GITHUB_WORKSPACE" --agent "$AGENT_NAME" --model "$MODEL_ROUTE" --format json "$PROMPT" > "$RUNNER_TEMP/agent-output.jsonl" 2> "$RUNNER_TEMP/opencode-stderr.txt"
          fi
          opencode_exit=$?
          set -e
          export OPENCODE_EXIT_CODE="$opencode_exit"
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess, sys, urllib.error, urllib.request
          sys.path.insert(0, str(pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "scripts"))
          from opencode_smoke import extract_final_assistant_text

          runner_temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          path = runner_temp / "agent-output.jsonl"
          stderr_path = runner_temp / "opencode-stderr.txt"
          raw = path.read_text(encoding="utf-8", errors="replace") if path.exists() else ""
          stderr_raw = stderr_path.read_text(encoding="utf-8", errors="replace") if stderr_path.exists() else ""
          opencode_exit = int(os.environ.get("OPENCODE_EXIT_CODE", "0"))
          secret = os.environ.get("NVIDIA_API_KEY", "")
          events = []
          session_id = ""
          for line in raw.splitlines():
              try:
                  event = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if not isinstance(event, dict):
                  continue
              events.append(event)
              part = event.get("part") or {}
              if isinstance(part, dict):
                  session_id = session_id or event.get("sessionID") or part.get("sessionID", "")

          export_status = "not-attempted"
          export_raw = ""
          transcript = {}
          answer = ""
          latest_finish = "missing"
          unfinished_tools = set()
          if session_id:
              try:
                  exported = subprocess.run(
                      ["opencode", "export", session_id, "--sanitize"],
                      capture_output=True, text=True, timeout=60
                  )
                  export_status = str(exported.returncode)
                  export_raw = exported.stdout or ""
                  if exported.returncode == 0:
                      try:
                          transcript = json.loads(export_raw)
                          answer = extract_final_assistant_text(transcript)
                          for message in reversed(transcript.get("messages", [])):
                              if not isinstance(message, dict):
                                  continue
                              info = message.get("info") or {}
                              if not isinstance(info, dict):
                                  info = {}
                              role = info.get("role") or message.get("role")
                              if role != "assistant":
                                  continue
                              latest_finish = info.get("finish") or message.get("finish") or "missing"
                              for part in message.get("parts", []):
                                  if not isinstance(part, dict) or part.get("type") != "tool":
                                      continue
                                  state = part.get("state") or {}
                                  status = state.get("status", "unknown") if isinstance(state, dict) else "unknown"
                                  if status != "completed":
                                      unfinished_tools.add(str(part.get("tool", "unknown")) + ":" + str(status))
                              break
                      except (json.JSONDecodeError, AttributeError, TypeError):
                          export_status = "invalid-json"
              except subprocess.TimeoutExpired:
                  export_status = "timeout"
              except OSError as error:
                  export_status = type(error).__name__

          combined = raw + "\n" + export_raw + "\n" + stderr_raw + "\n" + answer
          if (secret and secret in combined) or re.search(r"(?i)nvapi-[A-Za-z0-9_-]{12,}|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}", combined):
              print("::error::Diagnostic output resembled a credential; output suppressed.")
              sys.exit(1)

          event_types = sorted({str(event.get("type")) for event in events})
          error_names = sorted({
              str((event.get("error") or {}).get("name"))
              for event in events if isinstance(event.get("error"), dict)
          })
          debug_lower = stderr_raw.lower()
          debug_patterns = {
              "permission-or-approval": ("permission", "approval required", "user approval"),
              "tool-dispatch": ("tool_use", "tool use", "tool.execute"),
              "timeout": ("timeout", "timed out", "deadline exceeded"),
              "rate-limit": ("rate limit", "too many requests", "http 429"),
              "authentication": ("http 401", "http 403", "unauthorized", "forbidden"),
              "network": ("econnreset", "econnrefused", "enotfound", "socket hang up"),
              "provider": ("provider error", "chat completion", "upstream error"),
          }
          debug_signals = sorted(
              label for label, patterns in debug_patterns.items()
              if any(pattern in debug_lower for pattern in patterns)
          )
          if not answer or opencode_exit != 0:
              direct_status = "not-tested"
              try:
                  payload = json.dumps({
                      "model": os.environ["MODEL_ID"],
                      "messages": [{"role": "user", "content": "Reply READY."}],
                      "max_tokens": 16,
                      "temperature": 0,
                      "stream": False
                  }).encode()
                  request = urllib.request.Request(
                      "https://integrate.api.nvidia.com/v1/chat/completions",
                      data=payload,
                      headers={"Authorization": "Bearer " + secret, "Content-Type": "application/json"}
                  )
                  with urllib.request.urlopen(request, timeout=20) as response:
                      direct = json.loads(response.read().decode("utf-8"))
                      choices = direct.get("choices", [])
                      message = choices[0].get("message", {}) if choices else {}
                      direct_text = message.get("content", "")
                      direct_status = "HTTP " + str(response.status) + (" with text" if isinstance(direct_text, str) and direct_text.strip() else " without text")
              except urllib.error.HTTPError as error:
                  direct_status = "HTTP " + str(error.code)
              except Exception as error:
                  direct_status = type(error).__name__
              tool_summary = ",".join(sorted(unfinished_tools)) or "none"
              print("::error::OpenCode did not produce a completed final assistant response. session=" + (session_id or "missing") + "; finish=" + latest_finish + "; tools=" + tool_summary + "; event_types=" + ",".join(event_types) + "; error_events=" + ",".join(error_names) + "; debug_signals=" + ",".join(debug_signals) + "; session_export=" + export_status + "; direct_nim=" + direct_status + "; opencode_exit=" + str(opencode_exit))
              sys.exit(1)

          report = "# " + os.environ["AGENT_NAME"] + "\n\nModel: " + os.environ["MODEL_ID"] + "\n\n" + answer + "\n"
          (runner_temp / "agent-report.md").write_text(report, encoding="utf-8")
          path.unlink(missing_ok=True)
          print("OpenCode produced a final assistant message with finish=stop; response artifact prepared. debug_signals=" + ",".join(debug_signals))
          PY
          worktree_status="$(git status --porcelain=v1 --untracked-files=all)"
          if [ -n "$worktree_status" ]; then
            echo "::error::The diagnostic agent changed the checkout; changes are not accepted."
            printf '%s\n' "$worktree_status" | head -n 20
            exit 1
          fi

      - name: Upload the agent response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: utilora-agent-response-${{ matrix.agent }}
          path: ${{ runner.temp }}/agent-report.md
          if-no-files-found: ignore
          retention-days: 3

      - name: Stop local preview
        if: always() && matrix.agent == 'visual-reviewer'
        run: |
          if [ -f "$RUNNER_TEMP/utilora-vite.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/utilora-vite.pid")" 2>/dev/null || true
          fi
