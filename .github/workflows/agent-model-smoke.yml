name: UTILORA agent capability check

on:
  workflow_dispatch:
    inputs:
      utilora_ref:
        description: Optional UTILORA branch, tag, or commit to inspect
        required: false
        type: string
        default: ""

concurrency:
  group: utilora-agent-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  credential-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require NVIDIA NIM credential
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -euo pipefail
          set +x
          if [ -z "$NVIDIA_API_KEY" ]; then
            echo "::error::Missing repository Actions secret NVIDIA_API_KEY."
            exit 1
          fi
          echo "NVIDIA NIM credential is configured; its value is not displayed."

  agent-check:
    needs: credential-preflight
    name: "${{ matrix.agent }} · ${{ matrix.model_id }}"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - agent: project-lead
            model_alias: nemotron-ultra
            model_id: nvidia/nemotron-3-ultra-550b-a55b
          - agent: problem-analyst
            model_alias: deepseek-v4-1-flash
            model_id: deepseek-ai/deepseek-v4.1-flash
          - agent: implementation-engineer
            model_alias: minimax-m3-1-flash
            model_id: minimaxai/minimax-m3.1-flash
          - agent: fast-task-engineer
            model_alias: glm-5-3-flash
            model_id: z-ai/glm-5.3-flash
          - agent: visual-reviewer
            model_alias: nemotron-super-vl
            model_id: nvidia/nemotron-3.5-super-vl-120b-a12b
          - agent: long-horizon-engineer
            model_alias: laguna-xs-2-1
            model_id: poolside/laguna-xs-2.1
          - agent: qa-engineer
            model_alias: deepseek-v4-1-flash
            model_id: deepseek-ai/deepseek-v4.1-flash
          - agent: security-auditor
            model_alias: nemotron-ultra
            model_id: nvidia/nemotron-3-ultra-550b-a55b

    steps:
      - name: Checkout UTILORA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.utilora_ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install OpenCode
        run: npm install --global opencode-ai@1

      - name: Record OpenCode CLI version
        run: opencode --version

      - name: Prepare a real visual sample
        if: matrix.agent == 'visual-reviewer'
        run: |
          set -euo pipefail
          npm install --no-package-lock --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run dev -- --host 127.0.0.1 --port 3000 > "$RUNNER_TEMP/utilora-vite.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/utilora-vite.pid"
          ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::Local preview did not become ready."
            tail -n 30 "$RUNNER_TEMP/utilora-vite.log"
            exit 1
          fi
          npx playwright screenshot --browser chromium --viewport-size "1365,900" http://127.0.0.1:3000/ "$RUNNER_TEMP/utilora-homepage.png"
          test -s "$RUNNER_TEMP/utilora-homepage.png"

      - name: Ask the agent for its role perspective
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          AGENT_NAME: ${{ matrix.agent }}
          MODEL_ROUTE: nvidia-nim/${{ matrix.model_alias }}
          MODEL_ID: ${{ matrix.model_id }}
          SCREENSHOT: ${{ runner.temp }}/utilora-homepage.png
        run: |
          set -euo pipefail
          set +x
          PROMPT="$(cat <<'EOF'
          You are participating in a lightweight, read-only capability check for UTILORA.
          Respond from your specialist role. Use your own judgment and choose your own approach.
          Skills are optional: use any available skill if it helps, or use none. No particular skill, tool sequence, minimum evidence count, checklist, or fixed report format is required.
          Consider one useful improvement, observation, risk, or question that could help the wider eight-agent team. You may suggest alternatives and respectfully disagree with assumptions.
          Be honest about what you actually inspected and what remains uncertain. Do not fabricate tool calls, evidence, screenshots, or results.
          Do not edit files, create or delete files, commit, push, merge, deploy, inspect environment variables, read .env files, or call external services.
          Answer naturally and concisely.
          EOF
          )"
          if [ "$AGENT_NAME" = "visual-reviewer" ]; then
            opencode run --dir "$GITHUB_WORKSPACE" --agent "$AGENT_NAME" --model "$MODEL_ROUTE" --file "$SCREENSHOT" --format json "$PROMPT" > "$RUNNER_TEMP/agent-output.jsonl" 2> "$RUNNER_TEMP/opencode-stderr.txt"
          else
            opencode run --dir "$GITHUB_WORKSPACE" --agent "$AGENT_NAME" --model "$MODEL_ROUTE" --format json "$PROMPT" > "$RUNNER_TEMP/agent-output.jsonl" 2> "$RUNNER_TEMP/opencode-stderr.txt"
          fi
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess, sys, urllib.error, urllib.request
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "agent-output.jsonl"
          raw = path.read_text(encoding="utf-8", errors="replace")
          secret = os.environ.get("NVIDIA_API_KEY", "")
          events = []
          event_parts = []
          session_id = ""
          for line in raw.splitlines():
              try:
                  event = json.loads(line)
              except json.JSONDecodeError:
                  continue
              events.append(event)
              session_id = session_id or event.get("sessionID") or (event.get("part") or {}).get("sessionID", "")
              part = event.get("part") or {}
              if event.get("type") == "text" and isinstance(part.get("text"), str):
                  event_parts.append(part["text"])
          answer = "\n".join(event_parts).strip()
          export_status = "not-attempted"
          export_raw = ""
          if session_id:
              exported = subprocess.run(
                  ["opencode", "export", session_id, "--sanitize"],
                  capture_output=True, text=True, timeout=90
              )
              export_status = str(exported.returncode)
              export_raw = exported.stdout or ""
              if exported.returncode == 0:
                  try:
                      transcript = json.loads(exported.stdout)
                      transcript_parts = []
                      for message in transcript.get("messages", []):
                          info = message.get("info") or {}
                          role = info.get("role") or message.get("role")
                          if role != "assistant":
                              continue
                          for part in message.get("parts", []):
                              if part.get("type") == "text" and not part.get("synthetic") and not part.get("ignored"):
                                  value = part.get("text")
                                  if isinstance(value, str) and value.strip():
                                      transcript_parts.append(value)
                      transcript_answer = "\n".join(transcript_parts).strip()
                      if transcript_answer:
                          answer = transcript_answer
                  except (json.JSONDecodeError, AttributeError, TypeError):
                      export_status = "invalid-json"
          combined = raw + "\n" + export_raw + "\n" + answer
          if (secret and secret in combined) or re.search(r"(?i)nvapi-[A-Za-z0-9_-]{12,}|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}", combined):
              print("::error::Diagnostic output resembled a credential; output suppressed.")
              sys.exit(1)
          if not answer:
              kinds = sorted({str(event.get("type")) for event in events})
              error_names = sorted({
                  str((event.get("error") or {}).get("name"))
                  for event in events if isinstance(event.get("error"), dict)
              })
              direct_status = "not-tested"
              try:
                  payload = json.dumps({
                      "model": os.environ["MODEL_ID"],
                      "messages": [{"role": "user", "content": "Reply with a brief confirmation that the model is reachable."}],
                      "max_tokens": 64,
                      "temperature": 0.1,
                      "stream": False
                  }).encode()
                  request = urllib.request.Request(
                      "https://integrate.api.nvidia.com/v1/chat/completions",
                      data=payload,
                      headers={"Authorization": "Bearer " + secret, "Content-Type": "application/json"}
                  )
                  with urllib.request.urlopen(request, timeout=90) as response:
                      direct = json.loads(response.read().decode("utf-8"))
                      choices = direct.get("choices", [])
                      message = choices[0].get("message", {}) if choices else {}
                      direct_text = message.get("content", "")
                      direct_status = "HTTP " + str(response.status) + (" with text" if isinstance(direct_text, str) and direct_text.strip() else " without text")
              except urllib.error.HTTPError as error:
                  direct_status = "HTTP " + str(error.code)
              except Exception as error:
                  direct_status = type(error).__name__
              print("::error::No final assistant text. session=" + (session_id or "missing") + "; event_types=" + ",".join(kinds) + "; error_events=" + ",".join(error_names) + "; session_export=" + export_status + "; direct_nim=" + direct_status)
              sys.exit(1)
          report = "# " + os.environ["AGENT_NAME"] + "\n\nModel: " + os.environ["MODEL_ID"] + "\n\n" + answer + "\n"
          pathlib.Path(os.environ["RUNNER_TEMP"], "agent-report.md").write_text(report, encoding="utf-8")
          path.unlink(missing_ok=True)
          print("Agent returned a response. Session export was used when the CLI JSON stream was incomplete; full response is retained as a short-lived artifact.")
          PY
          worktree_status="$(git status --porcelain=v1 --untracked-files=all)"
          if [ -n "$worktree_status" ]; then
            echo "::error::The diagnostic agent changed the checkout; changes are not accepted."
            printf '%s\n' "$worktree_status" | head -n 20
            exit 1
          fi

      - name: Upload the agent response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: utilora-agent-response-${{ matrix.agent }}
          path: ${{ runner.temp }}/agent-report.md
          if-no-files-found: ignore
          retention-days: 3

      - name: Stop local preview
        if: always() && matrix.agent == 'visual-reviewer'
        run: |
          if [ -f "$RUNNER_TEMP/utilora-vite.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/utilora-vite.pid")" 2>/dev/null || true
          fi
