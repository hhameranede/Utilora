<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#fafaf9">
  <title>You're offline — UTILORA</title>
  <style>
    :root{color-scheme:light;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#fafaf9;color:#292524}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px}
    main{width:min(100%,520px);padding:36px 28px;background:#fff;border:1px solid #e7e5e4;border-radius:24px;text-align:center;box-shadow:0 16px 44px rgba(41,37,36,.06)}
    .mark{width:64px;height:64px;margin:0 auto 22px;display:grid;place-items:center;border:1px solid #fed7aa;border-radius:20px;background:#fff7ed;color:#ea580c;font-size:34px;font-weight:800}
    .brand{margin:0;color:#a8a29e;font-size:11px;font-weight:700;letter-spacing:.22em}
    h1{margin:12px 0;color:#292524;font-size:clamp(26px,6vw,34px);letter-spacing:-.03em}
    p{margin:0 auto;max-width:390px;color:#78716c;font-size:14px;line-height:1.7}
    a{display:inline-flex;margin-top:26px;padding:12px 20px;border-radius:12px;background:#ea580c;color:#fff;text-decoration:none;font-size:13px;font-weight:700}
    a:focus-visible{outline:3px solid #fdba74;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">U</div>
    <p class="brand">UTILORA</p>
    <h1>You're offline</h1>
    <p>Connect to the internet to open new pages. Pages you've visited recently may still be available offline.</p>
    <a href="/en">Try again</a>
  </main>
</body>
</html>
